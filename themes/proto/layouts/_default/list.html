{{ define "main" }}
<main id="main">
  <h1>{{ .Title }}</h1>
  <p class="count">{{ len .Pages }} entries</p>
  {{ .Content }}
  {{ range .Pages.GroupByDate "2006" }}
  <h2>{{ .Key }}</h2>
  <ul class="post-list">
    {{ range .Pages }}
    <li><a href="{{ .RelPermalink }}">{{ .Title }}</a> <span class="rt">{{ .ReadingTime }} min</span> <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time></li>
    {{ end }}
  </ul>
  {{ end }}
</main>
{{ partial "footer.html" . }}
{{ end }}
