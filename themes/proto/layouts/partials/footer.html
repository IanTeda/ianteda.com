<footer class="site-footer">
  <span>&copy; {{ now.Year }} {{ site.Title }}</span>
  <span>built with hugo {{ hugo.Version }}</span>
  {{ with site.Params.social }}
  {{ with .github }}<a href="https://github.com/{{ . }}" rel="me">github</a>{{ end }}
  {{ with .twitter }}<a href="https://x.com/{{ . }}" rel="me">x</a>{{ end }}
  {{ with .linkedin }}<a href="https://www.linkedin.com/{{ . }}" rel="me">linkedin</a>{{ end }}
  {{ with .email }}<a href="mailto:{{ . }}">email</a>{{ end }}
  {{ end }}
</footer>
