#-- .github/workflows/check.yaml
# Runs scripts/check (Hugo build + front-matter lint) on drafts and on PRs,
# so a broken build is caught before it reaches main and deploys.

name: Check

on:
  push:
    branches:
      - drafts
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Hugo (version from mise.toml)
        uses: jdx/mise-action@v5
      - run: scripts/check
