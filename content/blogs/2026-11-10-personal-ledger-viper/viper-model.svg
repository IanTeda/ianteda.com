<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">The VIPER model: View, Interactor, Presenter, Entity and Router</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1b"/></marker>
  </defs>
  <rect width="800" height="380" fill="#f2f2f2"/>
  <g font-size="12" fill="#5a5a5a">
    <!-- View <-> Presenter -->
    <line x1="230" y1="88" x2="296" y2="88" stroke="#1d1d1b" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="263" y="80" text-anchor="middle">events</text>
    <line x1="300" y1="122" x2="234" y2="122" stroke="#1d1d1b" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="263" y="140" text-anchor="middle">view model</text>
    <!-- Presenter <-> Interactor -->
    <line x1="500" y1="88" x2="566" y2="88" stroke="#1d1d1b" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="533" y="80" text-anchor="middle">call</text>
    <line x1="570" y1="122" x2="504" y2="122" stroke="#1d1d1b" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="533" y="140" text-anchor="middle">result</text>
    <!-- Presenter -> Router -->
    <line x1="400" y1="150" x2="400" y2="246" stroke="#1d1d1b" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="408" y="202">navigate</text>
    <!-- Router -> View -->
    <path d="M300,290 H130 V154" fill="none" stroke="#1d1d1b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
    <text x="140" y="282">builds and opens</text>
    <!-- Interactor -> Entity -->
    <line x1="670" y1="150" x2="670" y2="246" stroke="#1d1d1b" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="678" y="202">uses</text>
  </g>
  <g>
    <rect x="30" y="50" width="200" height="100" fill="#fff" stroke="#1d1d1b" stroke-width="2"/>
    <text x="130" y="88" text-anchor="middle" font-size="20" font-weight="700" fill="#1d1d1b"><tspan fill="#ee3a1c">V</tspan>iew</text>
    <text x="130" y="112" text-anchor="middle" font-size="12" fill="#5a5a5a">Draws what it is told.</text>
    <text x="130" y="128" text-anchor="middle" font-size="12" fill="#5a5a5a">Reports what the user does.</text>

    <rect x="300" y="50" width="200" height="100" fill="#1d1d1b"/>
    <text x="400" y="88" text-anchor="middle" font-size="20" font-weight="700" fill="#fff"><tspan fill="#ee3a1c">P</tspan>resenter</text>
    <text x="400" y="112" text-anchor="middle" font-size="12" fill="#d0d0d0">Holds the screen's state.</text>
    <text x="400" y="128" text-anchor="middle" font-size="12" fill="#d0d0d0">Formats it for the View.</text>

    <rect x="570" y="50" width="200" height="100" fill="#fff" stroke="#1d1d1b" stroke-width="2"/>
    <text x="670" y="88" text-anchor="middle" font-size="20" font-weight="700" fill="#1d1d1b"><tspan fill="#ee3a1c">I</tspan>nteractor</text>
    <text x="670" y="112" text-anchor="middle" font-size="12" fill="#5a5a5a">One use case: "pay this bill".</text>
    <text x="670" y="128" text-anchor="middle" font-size="12" fill="#5a5a5a">Storage only through ports.</text>

    <rect x="300" y="250" width="200" height="100" fill="#fff" stroke="#1d1d1b" stroke-width="2"/>
    <text x="400" y="288" text-anchor="middle" font-size="20" font-weight="700" fill="#1d1d1b"><tspan fill="#ee3a1c">R</tspan>outer</text>
    <text x="400" y="312" text-anchor="middle" font-size="12" fill="#5a5a5a">Wires the module together.</text>
    <text x="400" y="328" text-anchor="middle" font-size="12" fill="#5a5a5a">Opens the next View or Dialog.</text>

    <rect x="570" y="250" width="200" height="100" fill="#fff" stroke="#1d1d1b" stroke-width="2"/>
    <text x="670" y="288" text-anchor="middle" font-size="20" font-weight="700" fill="#1d1d1b"><tspan fill="#ee3a1c">E</tspan>ntity</text>
    <text x="670" y="312" text-anchor="middle" font-size="12" fill="#5a5a5a">Plain data and its own rules.</text>
    <text x="670" y="328" text-anchor="middle" font-size="12" fill="#5a5a5a">No I/O, no idea a UI exists.</text>
  </g>
</svg>
