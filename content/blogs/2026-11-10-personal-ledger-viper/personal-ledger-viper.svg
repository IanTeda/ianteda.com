<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 640" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">How Personal Ledger splits VIPER across its crates</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1b"/></marker>
  </defs>
  <rect width="860" height="640" fill="#f2f2f2"/>
  <g font-size="11" font-weight="700" fill="#8a8a8a" letter-spacing="1.5">
    <text x="40" y="32">CLIENTS · TOOLKIT CODE</text>
    <text x="820" y="212" text-anchor="end">FEATURE CRATES · NO UI TOOLKIT, NO I/O</text>
    <text x="40" y="452">PERSISTENCE</text>
  </g>
  <!-- Clients -->
  <g>
    <rect x="40" y="44" width="370" height="100" fill="#fff" stroke="#1d1d1b" stroke-width="2"/>
    <text x="56" y="70" font-size="16" font-weight="700" fill="#1d1d1b">bin-desktop <tspan font-weight="400" font-size="12" fill="#5a5a5a">gpui</tspan></text>
    <rect x="56" y="86" width="160" height="40" fill="#e9e9e9"/><text x="136" y="111" text-anchor="middle" font-size="13" fill="#1d1d1b">Views</text>
    <rect x="232" y="86" width="160" height="40" fill="#e9e9e9"/><text x="312" y="111" text-anchor="middle" font-size="13" fill="#1d1d1b">Router impl</text>

    <rect x="450" y="44" width="370" height="100" fill="#fff" stroke="#1d1d1b" stroke-width="2"/>
    <text x="466" y="70" font-size="16" font-weight="700" fill="#1d1d1b">bin-tui <tspan font-weight="400" font-size="12" fill="#5a5a5a">ratatui</tspan></text>
    <rect x="466" y="86" width="160" height="40" fill="#e9e9e9"/><text x="546" y="111" text-anchor="middle" font-size="13" fill="#1d1d1b">Views</text>
    <rect x="642" y="86" width="160" height="40" fill="#e9e9e9"/><text x="722" y="111" text-anchor="middle" font-size="13" fill="#1d1d1b">Router impl</text>
  </g>
  <!-- bins depend on feature crates -->
  <g stroke="#1d1d1b" stroke-width="1.5">
    <line x1="225" y1="144" x2="225" y2="220" marker-end="url(#a)"/>
    <line x1="635" y1="144" x2="400" y2="220" marker-end="url(#a)"/>
  </g>
  <text x="233" y="182" font-size="12" fill="#5a5a5a">both Clients share one Presenter</text>
  <!-- Feature crates -->
  <g>
    <rect x="40" y="224" width="520" height="190" fill="#1d1d1b"/>
    <text x="56" y="252" font-size="16" font-weight="700" fill="#fff">lib-&lt;domain&gt; <tspan font-weight="400" font-size="12" fill="#d0d0d0">e.g. lib-bills, lib-payees, lib-units</tspan></text>
    <g font-size="13" fill="#1d1d1b" text-anchor="middle">
      <rect x="56" y="268" width="156" height="58" fill="#fff"/><text x="134" y="292" font-weight="700">Presenters</text><text x="134" y="310" font-size="11" fill="#5a5a5a">one per View</text>
      <rect x="222" y="268" width="156" height="58" fill="#fff"/><text x="300" y="292" font-weight="700">Interactors</text><text x="300" y="310" font-size="11" fill="#5a5a5a">one file per use case</text>
      <rect x="388" y="268" width="156" height="58" fill="#fff"/><text x="466" y="292" font-weight="700">Entities</text><text x="466" y="310" font-size="11" fill="#5a5a5a">model and rules</text>
      <rect x="56" y="338" width="240" height="58" fill="#fff"/><text x="176" y="362" font-weight="700">Ports and Router trait</text><text x="176" y="380" font-size="11" fill="#5a5a5a">protocols.rs</text>
      <rect x="306" y="338" width="238" height="58" fill="#fff"/><text x="425" y="362" font-weight="700">Keymap and Messages</text><text x="425" y="380" font-size="11" fill="#5a5a5a">keymap.rs, i18n/</text>
    </g>
    <rect x="590" y="224" width="230" height="190" fill="#fff" stroke="#1d1d1b" stroke-width="2"/>
    <text x="606" y="252" font-size="16" font-weight="700" fill="#1d1d1b">lib-&lt;workflow&gt;</text>
    <text x="606" y="274" font-size="12" fill="#5a5a5a">e.g. lib-bill-payments</text>
    <g font-size="12" fill="#1d1d1b">
      <text x="606" y="306">A write that spans domains:</text>
      <text x="606" y="324">paying a Bill writes a</text>
      <text x="606" y="342">Transaction and the Bill</text>
      <text x="606" y="360">Schedule entry it settles,</text>
      <text x="606" y="378">through <tspan font-weight="700">one atomic port</tspan>.</text>
    </g>
    <line x1="590" y1="319" x2="564" y2="319" stroke="#1d1d1b" stroke-width="1.5" marker-end="url(#a)"/>
  </g>
  <!-- Persistence -->
  <g>
    <rect x="40" y="464" width="520" height="84" fill="#fff" stroke="#ee3a1c" stroke-width="2"/>
    <text x="56" y="492" font-size="16" font-weight="700" fill="#1d1d1b">lib-database</text>
    <text x="56" y="514" font-size="12" fill="#5a5a5a">Implements every module's ports with SQLx, one adapter file per domain.</text>
    <text x="56" y="532" font-size="12" fill="#5a5a5a">Only the Clients depend on it, and they wire it in at start-up.</text>
    <rect x="620" y="472" width="200" height="68" fill="#fff" stroke="#1d1d1b" stroke-width="2"/>
    <text x="720" y="502" text-anchor="middle" font-size="16" font-weight="700" fill="#1d1d1b">SQLite</text>
    <text x="720" y="522" text-anchor="middle" font-size="12" fill="#5a5a5a">the Ledger file</text>
  </g>
  <g stroke="#ee3a1c" stroke-width="1.5">
    <line x1="300" y1="464" x2="300" y2="418" marker-end="url(#a)"/>
    <line x1="560" y1="506" x2="616" y2="506" marker-end="url(#a)"/>
  </g>
  <text x="308" y="446" font-size="12" fill="#ee3a1c">implements the ports</text>
  <!-- Shared -->
  <rect x="40" y="572" width="780" height="48" fill="#e9e9e9"/>
  <text x="56" y="601" font-size="13" fill="#1d1d1b"><tspan font-weight="700">lib-core · lib-viper</tspan>  shared value types (Money, RowID) and the generic Presenter, keymap and Dialog contracts</text>
</svg>
