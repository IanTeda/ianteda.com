<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 562" width="1200" height="562" font-family="Archivo, 'Liberation Sans', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="562" fill="#f2f2f2"/>
  <!-- connectors -->
  <g stroke="#1d1d1b" stroke-width="2" stroke-dasharray="6 6" fill="none">
    <path d="M470 250 H410 V150 H370"/>
    <path d="M730 250 H790 V150 H830"/>
    <path d="M470 312 H410 V412 H370"/>
    <path d="M730 312 H790 V412 H830"/>
  </g>
  <!-- centre: me -->
  <rect x="470" y="196" width="260" height="170" fill="#1d1d1b"/>
  <text x="600" y="232" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#a8a8a8">ME</text>
  <g text-anchor="middle" font-size="22" font-weight="700" fill="#fff">
    <text x="600" y="272">Product owner</text>
    <text x="600" y="306">Architect</text>
    <text x="600" y="340">Reviewer</text>
  </g>
  <!-- cards -->
  <g fill="#fff" stroke="#1d1d1b" stroke-width="2">
    <rect x="60" y="80" width="310" height="140"/>
    <rect x="830" y="80" width="310" height="140"/>
    <rect x="60" y="342" width="310" height="140"/>
    <rect x="830" y="342" width="310" height="140"/>
  </g>
  <!-- icon tiles -->
  <g fill="#e9e9e9">
    <rect x="80" y="100" width="56" height="56"/>
    <rect x="850" y="100" width="56" height="56"/>
    <rect x="80" y="362" width="56" height="56"/>
    <rect x="850" y="362" width="56" height="56"/>
  </g>
  <g stroke="#1d1d1b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- code -->
    <path d="M100 116 L90 128 L100 140"/><path d="M116 116 L126 128 L116 140"/><path d="M111 113 L105 143"/>
    <!-- magnifier -->
    <circle cx="874" cy="124" r="11"/><path d="M882 132 L893 143"/>
    <!-- speech bubble with ? -->
    <path d="M92 374 H124 V398 H106 L98 406 V398 H92 Z"/>
    <path d="M104 382 Q108 377 112 382 Q113 386 108 388 V391"/>
    <!-- decision record -->
    <path d="M866 372 H884 L892 380 V408 H866 Z"/><path d="M872 388 H886"/><path d="M872 396 H886"/>
  </g>
  <circle cx="108" cy="396" r="1.8" fill="#1d1d1b"/>
  <!-- labels -->
  <g fill="#1d1d1b">
    <text x="150" y="122" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8a8a8a">01</text>
    <text x="150" y="146" font-size="22" font-weight="700">Junior developer</text>
    <text x="80" y="188" font-size="15" fill="#5a5a5a">Code, tests, fixes and</text>
    <text x="80" y="208" font-size="15" fill="#5a5a5a">throwaway prototypes</text>

    <text x="920" y="122" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8a8a8a">02</text>
    <text x="920" y="146" font-size="22" font-weight="700">Researcher</text>
    <text x="850" y="188" font-size="15" fill="#5a5a5a">Compares the options and</text>
    <text x="850" y="208" font-size="15" fill="#5a5a5a">writes up research notes</text>

    <text x="150" y="384" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8a8a8a">03</text>
    <text x="150" y="408" font-size="22" font-weight="700">Teacher</text>
    <text x="80" y="450" font-size="15" fill="#5a5a5a">Explains the new thing,</text>
    <text x="80" y="470" font-size="15" fill="#5a5a5a">using my own code</text>

    <text x="920" y="384" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8a8a8a">04</text>
    <text x="920" y="408" font-size="22" font-weight="700">Facilitator</text>
    <text x="850" y="450" font-size="15" fill="#5a5a5a">Questions the idea, records</text>
    <text x="850" y="470" font-size="15" fill="#5a5a5a">the decision and the tickets</text>
  </g>
  <text x="600" y="60" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#8a8a8a">THE AI ASSISTANT · FOUR ROLES</text>
</svg>
